name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Typecheck, Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint & Strict Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Run Vitest Unit & System Tests
        run: npm test

      - name: Build Production Client & Assets
        run: npm run build

      - name: Install Playwright Chromium
        run: npm run test:e2e:install

      - name: Run Playwright E2E Tests
        run: npm run test:e2e


name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Typecheck, Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint & Strict Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Run Vitest Unit & System Tests
        run: npm test

      - name: Build Production Client & Assets
        run: npm run build

      - name: Install Playwright Chromium
        run: npm run test:e2e:install

      - name: Run Playwright E2E & Visual Regression Tests
        run: npm run test:e2e

  lighthouse:
    name: Lighthouse CI (performance & accessibility budgets)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Client & Assets
        run: npm run build

      - name: Serve production build for Lighthouse
        run: npx vite preview --host 127.0.0.1 --port 3000 &

      - name: Wait for preview server
        run: sleep 10

      - name: Run Lighthouse CI (budgets in lighthouserc.json)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: http://127.0.0.1:3000/
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

